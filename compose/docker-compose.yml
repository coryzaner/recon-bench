---
# Standalone heavy ACTIVE tools (ZAP + Greenbone/OpenVAS). Lab-only.
# Bound to loopback by default. Never expose publicly. Launching a scan is an
# ACTIVE action: enforce scope + authorization operationally (see README).
name: testbench
services:
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080",
              "-config", "api.disablekey=false"]
    ports:
      - "${TB_BIND_ADDR:-127.0.0.1}:${ZAP_PORT:-8094}:8080"
    restart: unless-stopped
    profiles: ["zap", "all"]
  greenbone:
    image: greenbone/community-edition:stable
    ports:
      - "${TB_BIND_ADDR:-127.0.0.1}:${GREENBONE_PORT:-9392}:9392"
    volumes:
      - gvmd_data:/var/lib/gvmd
      - notus_data:/var/lib/notus
      - psql_data:/var/lib/postgresql
    restart: unless-stopped
    # Heavy: first start pulls multi-GB vulnerability feeds (slow). Opt-in.
    profiles: ["openvas", "all"]
volumes:
  gvmd_data:
  notus_data:
  psql_data:
