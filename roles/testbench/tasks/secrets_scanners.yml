---
# Secret-scanning active tools: gitleaks + trufflehog
# (install release binaries).
- name: Install gitleaks
  ansible.builtin.get_url:
    url: >-
      https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
    dest: /tmp/gitleaks.tgz
    mode: "0644"
  register: testbench_gl
  retries: 2
  delay: 5
  until: testbench_gl is succeeded

- name: Unpack gitleaks
  ansible.builtin.unarchive:
    src: /tmp/gitleaks.tgz
    dest: "{{ testbench_bin }}"
    remote_src: true
    include: [gitleaks]
    creates: "{{ testbench_bin }}/gitleaks"

- name: Install trufflehog (official installer, pinned dir)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
      | sh -s -- -b "{{ testbench_bin }}"
  args:
    creates: "{{ testbench_bin }}/trufflehog"
    executable: /bin/bash
